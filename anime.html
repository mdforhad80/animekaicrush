<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root {
  --bg-deep: #0a0a0f;
  --bg-card: rgba(20, 20, 30, 0.85);
  --bg-glass: rgba(30, 30, 45, 0.6);
  --accent: #8b5cf6;
  --accent-glow: #a78bfa;
  --accent-dark: #6d28d9;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --border: rgba(139, 92, 246, 0.2);
  --border-hover: rgba(139, 92, 246, 0.5);
  --shadow-glow: 0 0 40px rgba(139, 92, 246, 0.15);
  --radius: 12px;
  --radius-sm: 8px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow-x: hidden; max-width: 100%; background: var(--bg-deep); color: var(--text); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
a { text-decoration: none; color: inherit; }
img { max-width: 100%; display: block; }
button { border: none; background: none; cursor: pointer; font-family: inherit; color: inherit; }
ul { list-style: none; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

/* Header */
.header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; height: 64px; background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
.header-inner { max-width: 1400px; margin: 0 auto; height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.header-left { display: flex; align-items: center; gap: 16px; }
.hamburger { width: 40px; height: 40px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; border-radius: var(--radius-sm); transition: var(--transition); }
.hamburger span { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 2px; }
.hamburger:hover { background: rgba(139, 92, 246, 0.15); }
.logo { font-size: 1.5rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent-glow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.logo span { -webkit-text-fill-color: var(--text); }
.nav-desktop { display: none; }
.nav-desktop ul { display: flex; gap: 4px; }
.nav-desktop a { display: block; padding: 8px 14px; border-radius: var(--radius-sm); font-size: 0.875rem; font-weight: 500; color: var(--text-muted); transition: var(--transition); }
.nav-desktop a:hover, .nav-desktop a.active { color: var(--text); background: rgba(139, 92, 246, 0.15); }
.header-right { display: flex; align-items: center; gap: 12px; }
.search-btn, .profile-btn { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); color: var(--text-muted); transition: var(--transition); }
.search-btn:hover, .profile-btn:hover { background: rgba(139, 92, 246, 0.15); color: var(--text); }
.search-btn svg, .profile-btn svg { width: 20px; height: 20px; }

/* Sidebar */
.sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; opacity: 0; visibility: hidden; transition: var(--transition); }
.sidebar-overlay.open { opacity: 1; visibility: visible; }
.sidebar { position: fixed; top: 0; left: 0; width: 280px; max-width: 85vw; height: 100%; background: var(--bg-deep); border-right: 1px solid var(--border); z-index: 2001; transform: translateX(-100%); transition: transform 0.3s ease; overflow-y: auto; }
.sidebar.open { transform: translateX(0); }
.sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.sidebar-close { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-sm); color: var(--text-muted); }
.sidebar-nav { padding: 16px; }
.sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-sm); color: var(--text-muted); font-size: 0.9375rem; font-weight: 500; transition: var(--transition); }
.sidebar-nav a:hover { background: rgba(139, 92, 246, 0.15); color: var(--text); }

/* Auth Modal */
.auth-overlay { position: fixed; inset: 0; z-index: 4000; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); opacity: 0; visibility: hidden; transition: var(--transition); display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-overlay.open { opacity: 1; visibility: visible; }
.auth-modal { width: 100%; max-width: 420px; background: var(--bg-glass); backdrop-filter: blur(30px); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; position: relative; transform: scale(0.95); transition: transform 0.3s ease; box-shadow: var(--shadow-glow); }
.auth-overlay.open .auth-modal { transform: scale(1); }
.auth-close { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--text-muted); transition: var(--transition); }
.auth-close:hover { background: rgba(139, 92, 246, 0.15); color: var(--text); }
.auth-tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
.auth-tab { flex: 1; padding: 12px; text-align: center; font-size: 0.9375rem; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: var(--transition); }
.auth-tab.active { color: var(--accent-glow); border-bottom-color: var(--accent); }
.auth-form { display: none; }
.auth-form.active { display: block; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.auth-form .form-group { margin-bottom: 16px; }
.auth-form label { display: block; font-size: 0.8125rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
.auth-form input { width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 0.9375rem; outline: none; transition: var(--transition); }
.auth-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); }
.auth-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: white; font-size: 0.9375rem; font-weight: 600; border-radius: var(--radius-sm); transition: var(--transition); margin-top: 8px; }
.auth-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3); }
.auth-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.auth-error { padding: 10px 14px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: var(--radius-sm); color: #fca5a5; font-size: 0.875rem; margin-bottom: 16px; display: none; }
.auth-error.show { display: block; }

/* Anime Hero */
.anime-hero { position: relative; width: 100%; min-height: 400px; margin-top: 64px; overflow: hidden; }
.anime-hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center 20%; }
.anime-hero-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,10,15,0.3) 0%, var(--bg-deep) 100%); }
.anime-hero-content { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; padding: 40px 20px; display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; }
.anime-poster { flex: 0 0 200px; max-width: 200px; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-glow); aspect-ratio: 3/4; }
.anime-poster img { width: 100%; height: 100%; object-fit: cover; }
.anime-info { flex: 1; min-width: 280px; }
.anime-title { font-size: clamp(1.5rem, 3vw, 2.5rem); font-weight: 800; margin-bottom: 12px; line-height: 1.2; }
.anime-meta-row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; font-size: 0.875rem; color: var(--text-muted); }
.anime-score { display: flex; align-items: center; gap: 6px; color: #fbbf24; font-weight: 700; font-size: 1rem; }
.anime-genres { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.anime-genre { padding: 6px 14px; background: rgba(139, 92, 246, 0.15); border: 1px solid var(--border); border-radius: 20px; font-size: 0.8125rem; color: var(--accent-glow); transition: var(--transition); }
.anime-genre:hover { background: rgba(139, 92, 246, 0.3); }
.anime-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.anime-btn { display: flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: var(--radius-sm); font-size: 0.9375rem; font-weight: 600; transition: var(--transition); }
.anime-btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: white; }
.anime-btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3); }
.anime-btn-secondary { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: var(--text); }
.anime-btn-secondary:hover { background: rgba(255,255,255,0.15); }
.anime-btn-secondary.active { background: rgba(139, 92, 246, 0.3); border-color: var(--accent); color: var(--accent-glow); }

/* Content */
.content { max-width: 1400px; margin: 0 auto; padding: 0 20px 40px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 12px 20px; font-size: 0.9375rem; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: var(--transition); cursor: pointer; background: none; }
.tab.active { color: var(--accent-glow); border-bottom-color: var(--accent); }
.tab:hover { color: var(--text); }
.tab-panel { display: none; }
.tab-panel.active { display: block; animation: fadeIn 0.3s ease; }

/* Synopsis */
.synopsis { font-size: 0.9375rem; line-height: 1.8; color: var(--text-muted); max-width: 800px; }

/* Info Grid */
.info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.info-item { padding: 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); }
.info-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-glow); margin-bottom: 6px; }
.info-value { font-size: 0.9375rem; font-weight: 500; color: var(--text); }

/* Episodes */
.episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
.episode-card { padding: 14px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); text-align: center; cursor: pointer; transition: var(--transition); }
.episode-card:hover { border-color: var(--accent); background: rgba(139, 92, 246, 0.1); transform: translateY(-2px); }
.episode-card-num { font-size: 0.875rem; font-weight: 700; color: var(--text); }
.episode-card-title { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Characters */
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
.char-card { background: var(--bg-card); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); transition: var(--transition); }
.char-card:hover { border-color: var(--accent); transform: translateY(-4px); }
.char-img { aspect-ratio: 1; overflow: hidden; }
.char-img img { width: 100%; height: 100%; object-fit: cover; }
.char-info { padding: 10px; }
.char-name { font-size: 0.8125rem; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
.char-role { font-size: 0.75rem; color: var(--text-dim); }

/* Recommendations */
.rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
.rec-card { position: relative; border-radius: var(--radius); overflow: hidden; background: var(--bg-card); border: 1px solid var(--border); cursor: pointer; transition: var(--transition); }
.rec-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: var(--shadow-glow); }
.rec-img { aspect-ratio: 3/4; }
.rec-img img { width: 100%; height: 100%; object-fit: cover; }
.rec-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,10,15,0.9) 0%, transparent 60%); display: flex; align-items: flex-end; padding: 12px; }
.rec-title { font-size: 0.8125rem; font-weight: 600; line-height: 1.3; }

/* Trailer */
.trailer-wrap { position: relative; padding-bottom: 56.25%; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
.trailer-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }

/* Skeleton */
.skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%); background-size: 200% 100%; animation: skeleton 1.5s infinite; border-radius: var(--radius-sm); }
@keyframes skeleton { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* Loading */
.loading-state { padding: 60px 20px; text-align: center; color: var(--text-dim); }

/* Toast */
.toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 5000; display: flex; flex-direction: column; gap: 10px; }
.toast { padding: 14px 20px; background: var(--bg-glass); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 0.875rem; font-weight: 500; box-shadow: var(--shadow-glow); animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards; max-width: 320px; }
.toast.success { border-color: rgba(34, 197, 94, 0.5); }
.toast.error { border-color: rgba(239, 68, 68, 0.5); }
@keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes toastOut { to { transform: translateX(100%); opacity: 0; } }

/* Footer */
.footer { border-top: 1px solid var(--border); padding: 32px 20px; margin-top: 40px; }
.footer-inner { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.footer-logo { font-size: 1.25rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent-glow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.footer-text { font-size: 0.8125rem; color: var(--text-dim); max-width: 600px; }
.footer-copy { font-size: 0.75rem; color: var(--text-dim); }

@media (min-width: 768px) {
  .hamburger { display: none; }
  .nav-desktop { display: block; }
  .anime-hero-content { padding: 60px 40px; }
  .content { padding: 0 40px 60px; }
  .char-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .rec-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
}
@media (max-width: 480px) {
  .anime-poster { flex: 0 0 140px; max-width: 140px; }
  .anime-actions { flex-direction: column; }
  .anime-btn { width: 100%; justify-content: center; }
}
</style>

<script>
const API_BASE = 'https://api.jikan.moe/v4';
const WORKER_URL = localStorage.getItem('workerUrl') || '';

const $ = (s, c = document) => c.querySelector(s);
const $$ = (s, c = document) => Array.from(c.querySelectorAll(s));
const wait = (ms) => new Promise(r => setTimeout(r, ms));

function showToast(msg, type = 'success') {
  const c = $('#toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function getToken() { return localStorage.getItem('token'); }
let currentUser = null;
let currentAnime = null;

async function fetchWithRetry(url, retries = 3) {
  for (let i = 0; i < retries; i++) {
    try {
      const ctrl = new AbortController();
      const id = setTimeout(() => ctrl.abort(), 10000);
      const res = await fetch(url, { signal: ctrl.signal });
      clearTimeout(id);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) { if (i === retries - 1) throw e; await wait(1000 * (i + 1)); }
  }
}

async function fetchUser() {
  const token = getToken();
  if (!token || !WORKER_URL) return;
  try {
    const res = await fetch(`${WORKER_URL}/api/me`, { headers: { 'Authorization': 'Bearer ' + token } });
    if (res.ok) { currentUser = await res.json(); updateProfileUI(); }
    else throw new Error();
  } catch { currentUser = null; updateProfileUI(); }
}

function updateProfileUI() {
  const btn = $('#profileBtn');
  if (currentUser) {
    btn.innerHTML = `<img src="${currentUser.avatar || 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%238b5cf6"%3E%3Ccircle cx="12" cy="12" r="12"/%3E%3Ctext x="12" y="16" text-anchor="middle" fill="white" font-size="12" font-family="sans-serif"%3E${(currentUser.name||'U').charAt(0).toUpperCase()}%3C/text%3E%3C/svg%3E'}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #8b5cf6">`;
    btn.onclick = () => location.href = 'profile.html';
  } else {
    btn.innerHTML = `<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="20" height="20"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
    btn.onclick = () => openAuth();
  }
}

function openAuth() { $('#authOverlay').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeAuth() { $('#authOverlay').classList.remove('open'); document.body.style.overflow = ''; }
function switchAuthTab(tab) {
  $$('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  $$('.auth-form').forEach(f => f.classList.toggle('active', f.id === tab + 'Form'));
  $('#authError').classList.remove('show');
}

async function handleLogin(e) {
  e.preventDefault();
  if (!WORKER_URL) { showToast('Backend not configured', 'error'); return; }
  const btn = $('#loginBtn'); btn.disabled = true;
  try {
    const res = await fetch(`${WORKER_URL}/api/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('#loginEmail').value, password: $('#loginPassword').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    localStorage.setItem('token', data.token);
    await fetchUser(); closeAuth(); showToast('Welcome back!');
  } catch (err) { $('#authError').textContent = err.message; $('#authError').classList.add('show'); }
  finally { btn.disabled = false; }
}

async function handleSignup(e) {
  e.preventDefault();
  if (!WORKER_URL) { showToast('Backend not configured', 'error'); return; }
  if ($('#signupPassword').value !== $('#signupConfirm').value) { $('#authError').textContent = 'Passwords do not match'; $('#authError').classList.add('show'); return; }
  const btn = $('#signupBtn'); btn.disabled = true;
  try {
    const res = await fetch(`${WORKER_URL}/api/signup`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: $('#signupName').value, username: $('#signupUsername').value, email: $('#signupEmail').value, password: $('#signupPassword').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Signup failed');
    localStorage.setItem('token', data.token);
    await fetchUser(); closeAuth(); showToast('Account created!');
  } catch (err) { $('#authError').textContent = err.message; $('#authError').classList.add('show'); }
  finally { btn.disabled = false; }
}

function getAnimeId() {
  const p = new URLSearchParams(location.search);
  return p.get('id');
}

async function loadAnime() {
  const id = getAnimeId();
  if (!id) { $('#animeTitle').textContent = 'Anime not found'; return; }

  try {
    const [animeRes, epsRes, charsRes, recRes] = await Promise.allSettled([
      fetchWithRetry(`${API_BASE}/anime/${id}/full`),
      fetchWithRetry(`${API_BASE}/anime/${id}/episodes`),
      fetchWithRetry(`${API_BASE}/anime/${id}/characters`),
      fetchWithRetry(`${API_BASE}/anime/${id}/recommendations`)
    ]);

    const anime = animeRes.status === 'fulfilled' ? animeRes.value.data : null;
    if (!anime) throw new Error('Failed to load anime');
    currentAnime = anime;

    // Hero
    const bg = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
    $('#heroBg').style.backgroundImage = `url('${bg}')`;
    $('#animePoster').innerHTML = `<img src="${anime.images?.jpg?.image_url}" alt="${anime.title}">`;
    $('#animeTitle').textContent = anime.title_english || anime.title;

    const meta = [];
    if (anime.score) meta.push(`<span class="anime-score">★ ${anime.score}</span>`);
    if (anime.type) meta.push(`<span>${anime.type}</span>`);
    if (anime.status) meta.push(`<span>${anime.status}</span>`);
    if (anime.episodes) meta.push(`<span>${anime.episodes} Episodes</span>`);
    if (anime.duration) meta.push(`<span>${anime.duration}</span>`);
    if (anime.rating) meta.push(`<span>${anime.rating}</span>`);
    if (anime.aired?.from) meta.push(`<span>${new Date(anime.aired.from).getFullYear()}</span>`);
    $('#animeMeta').innerHTML = meta.join('');

    $('#animeGenres').innerHTML = (anime.genres || []).map(g => `<a href="search.html?genre=${g.mal_id}" class="anime-genre">${g.name}</a>`).join('');

    const favCheck = await checkFavorite(anime.mal_id);
    const bmCheck = await checkBookmark(anime.mal_id);
    $('#animeActions').innerHTML = `
      <a href="watch.html?id=${anime.mal_id}&ep=1" class="anime-btn anime-btn-primary">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Watch Now
      </a>
      <button class="anime-btn anime-btn-secondary ${favCheck ? 'active' : ''}" id="favBtn" onclick="toggleFavorite()">
        <svg width="18" height="18" fill="${favCheck ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> ${favCheck ? 'Favorited' : 'Favorite'}
      </button>
      <button class="anime-btn anime-btn-secondary ${bmCheck ? 'active' : ''}" id="bmBtn" onclick="toggleBookmark()">
        <svg width="18" height="18" fill="${bmCheck ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> ${bmCheck ? 'Bookmarked' : 'Bookmark'}
      </button>
    `;

    // Synopsis
    $('#synopsisText').textContent = anime.synopsis || 'No synopsis available.';

    // Info Grid
    const info = [
      { label: 'Type', value: anime.type || 'N/A' },
      { label: 'Episodes', value: anime.episodes || 'N/A' },
      { label: 'Status', value: anime.status || 'N/A' },
      { label: 'Aired', value: anime.aired?.string || 'N/A' },
      { label: 'Season', value: anime.season ? anime.season.charAt(0).toUpperCase() + anime.season.slice(1) + ' ' + anime.year : 'N/A' },
      { label: 'Duration', value: anime.duration || 'N/A' },
      { label: 'Rating', value: anime.rating || 'N/A' },
      { label: 'Score', value: anime.score ? `${anime.score} / 10 (${anime.scored_by?.toLocaleString()} votes)` : 'N/A' },
      { label: 'Rank', value: anime.rank ? `#${anime.rank}` : 'N/A' },
      { label: 'Popularity', value: anime.popularity ? `#${anime.popularity}` : 'N/A' },
      { label: 'Members', value: anime.members?.toLocaleString() || 'N/A' },
      { label: 'Favorites', value: anime.favorites?.toLocaleString() || 'N/A' },
      { label: 'Studios', value: (anime.studios || []).map(s => s.name).join(', ') || 'N/A' },
      { label: 'Source', value: anime.source || 'N/A' },
    ];
    $('#infoGrid').innerHTML = info.map(i => `<div class="info-item"><div class="info-label">${i.label}</div><div class="info-value">${i.value}</div></div>`).join('');

    // Trailer
    if (anime.trailer?.embed_url) {
      $('#trailerSection').innerHTML = `<h3 style="margin-bottom:16px;font-size:1.125rem">Trailer</h3><div class="trailer-wrap"><iframe src="${anime.trailer.embed_url}" allowfullscreen loading="lazy"></iframe></div>`;
    }

    // Episodes
    const eps = epsRes.status === 'fulfilled' ? epsRes.value.data : [];
    if (eps.length) {
      $('#episodesGrid').innerHTML = eps.map(ep => `
        <a href="watch.html?id=${id}&ep=${ep.mal_id}" class="episode-card">
          <div class="episode-card-num">EP ${ep.mal_id}</div>
          <div class="episode-card-title">${ep.title || 'Episode ' + ep.mal_id}</div>
        </a>
      `).join('');
    } else {
      $('#episodesGrid').innerHTML = '<p style="color:var(--text-dim)">No episode data available.</p>';
    }

    // Characters
    const chars = charsRes.status === 'fulfilled' ? charsRes.value.data : [];
    if (chars.length) {
      $('#charGrid').innerHTML = chars.slice(0, 24).map(c => `
        <div class="char-card">
          <div class="char-img"><img src="${c.character?.images?.jpg?.image_url}" alt="${c.character?.name}" loading="lazy"></div>
          <div class="char-info">
            <div class="char-name">${c.character?.name}</div>
            <div class="char-role">${c.role}</div>
          </div>
        </div>
      `).join('');
    } else {
      $('#charGrid').innerHTML = '<p style="color:var(--text-dim)">No character data available.</p>';
    }

    // Relations
    const rels = anime.relations || [];
    if (rels.length) {
      $('#relationsGrid').innerHTML = rels.flatMap(r => (r.entry || []).map(e => `
        <div class="rec-card" onclick="location.href='anime.html?id=${e.mal_id}'">
          <div class="rec-img"><img src="https://cdn.myanimelist.net/images/questionmark_50.gif" alt="${e.name}" loading="lazy"></div>
          <div class="rec-overlay"><div class="rec-title">${e.name}</div></div>
          <div style="position:absolute;top:8px;left:8px;padding:4px 8px;background:rgba(139,92,246,0.9);border-radius:4px;font-size:0.6875rem;font-weight:700">${r.relation}</div>
        </div>
      `)).join('');
    } else {
      $('#relationsGrid').innerHTML = '<p style="color:var(--text-dim)">No relations available.</p>';
    }

    // Recommendations
    const recs = recRes.status === 'fulfilled' ? recRes.value.data : [];
    if (recs.length) {
      $('#recGrid').innerHTML = recs.slice(0, 12).map(r => `
        <div class="rec-card" onclick="location.href='anime.html?id=${r.entry.mal_id}'">
          <div class="rec-img"><img src="${r.entry.images?.jpg?.image_url}" alt="${r.entry.title}" loading="lazy"></div>
          <div class="rec-overlay"><div class="rec-title">${r.entry.title}</div></div>
        </div>
      `).join('');
    } else {
      $('#recGrid').innerHTML = '<p style="color:var(--text-dim)">No recommendations available.</p>';
    }

    // Update title
    document.title = `${anime.title_english || anime.title} - AnimeStream`;

  } catch (err) {
    $('#animeTitle').textContent = 'Error loading anime';
    $('#synopsisText').textContent = 'Failed to load anime data. Please try again later.';
    console.error(err);
  }
}

async function checkFavorite(malId) {
  if (!currentUser || !WORKER_URL) return false;
  try {
    const res = await fetch(`${WORKER_URL}/api/favorites/${malId}`, { headers: { 'Authorization': 'Bearer ' + getToken() } });
    return res.ok;
  } catch { return false; }
}

async function checkBookmark(malId) {
  if (!currentUser || !WORKER_URL) return false;
  try {
    const res = await fetch(`${WORKER_URL}/api/bookmarks/${malId}`, { headers: { 'Authorization': 'Bearer ' + getToken() } });
    return res.ok;
  } catch { return false; }
}

async function toggleFavorite() {
  if (!currentUser) { openAuth(); return; }
  if (!currentAnime || !WORKER_URL) return;
  const btn = $('#favBtn');
  try {
    const isFav = btn.classList.contains('active');
    const res = await fetch(`${WORKER_URL}/api/favorites`, {
      method: isFav ? 'DELETE' : 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
      body: JSON.stringify({ mal_id: currentAnime.mal_id, title: currentAnime.title_english || currentAnime.title, image: currentAnime.images?.jpg?.image_url, type: currentAnime.type, score: currentAnime.score })
    });
    if (res.ok) {
      btn.classList.toggle('active');
      btn.innerHTML = `<svg width="18" height="18" fill="${!isFav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> ${isFav ? 'Favorite' : 'Favorited'}`;
      showToast(isFav ? 'Removed from favorites' : 'Added to favorites');
    }
  } catch { showToast('Action failed', 'error'); }
}

async function toggleBookmark() {
  if (!currentUser) { openAuth(); return; }
  if (!currentAnime || !WORKER_URL) return;
  const btn = $('#bmBtn');
  try {
    const isBm = btn.classList.contains('active');
    const res = await fetch(`${WORKER_URL}/api/bookmarks`, {
      method: isBm ? 'DELETE' : 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() },
      body: JSON.stringify({ mal_id: currentAnime.mal_id, title: currentAnime.title_english || currentAnime.title, image: currentAnime.images?.jpg?.image_url, type: currentAnime.type, episode: 1 })
    });
    if (res.ok) {
      btn.classList.toggle('active');
      btn.innerHTML = `<svg width="18" height="18" fill="${!isBm ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> ${isBm ? 'Bookmark' : 'Bookmarked'}`;
      showToast(isBm ? 'Removed bookmark' : 'Bookmarked');
    }
  } catch { showToast('Action failed', 'error'); }
}

// Tabs
$$('.tab').forEach(t => {
  t.onclick = () => {
    $$('.tab').forEach(x => x.classList.remove('active'));
    $$('.tab-panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    $(`#${t.dataset.panel}`).classList.add('active');
  };
});

// Events
document.addEventListener('DOMContentLoaded', () => {
  fetchUser();
  loadAnime();

  $('#hamburger').onclick = () => { $('#sidebar').classList.add('open'); $('#sidebarOverlay').classList.add('open'); };
  $('#sidebarClose').onclick = $('#sidebarOverlay').onclick = () => { $('#sidebar').classList.remove('open'); $('#sidebarOverlay').classList.remove('open'); };

  $('#authClose').onclick = () => closeAuth();
  $('#authOverlay').onclick = e => { if (e.target === $('#authOverlay')) closeAuth(); };
  $$('.auth-tab').forEach(t => t.onclick = () => switchAuthTab(t.dataset.tab));
  $('#loginForm').onsubmit = handleLogin;
  $('#signupForm').onsubmit = handleSignup;

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAuth(); });
});
</script>
