<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anime Details - AnimeVault</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg-primary:#080810;--bg-secondary:#0d0d1a;--bg-card:#111122;--bg-glass:rgba(255,255,255,0.04);--accent:#7c3aed;--accent-bright:#a855f7;--accent-glow:rgba(124,58,237,0.4);--accent-soft:rgba(168,85,247,0.15);--text-primary:#f0f0ff;--text-secondary:#8888aa;--text-muted:#55556a;--border:rgba(255,255,255,0.07);--border-accent:rgba(124,58,237,0.3);--header-h:64px;--radius:10px;--radius-lg:16px;--transition:0.25s cubic-bezier(0.4,0,0.2,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100%;background:var(--bg-primary);color:var(--text-primary);font-family:'Outfit',sans-serif}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* HEADER */
#header{position:fixed;top:0;left:0;right:0;height:var(--header-h);z-index:1000;background:rgba(8,8,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;height:100%;padding:0 24px;gap:12px;max-width:1800px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;margin:0 auto}
.logo-mark{width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent-bright));border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;box-shadow:0 0 20px var(--accent-glow)}
.logo-text{font-size:22px;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,#fff 40%,var(--accent-bright));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.icon-btn{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background var(--transition),color var(--transition);color:var(--text-secondary);font-size:18px}
.icon-btn:hover{background:var(--bg-glass);color:var(--text-primary)}
.back-btn{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-secondary);transition:all var(--transition)}
.back-btn:hover{background:var(--bg-glass);color:var(--text-primary)}

/* BANNER */
.banner-area{position:relative;height:420px;overflow:hidden;margin-top:var(--header-h)}
.banner-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(0.35) blur(2px);transform:scale(1.05)}
.banner-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 0%,var(--bg-primary) 100%),linear-gradient(to right,var(--bg-primary) 0%,transparent 40%)}
@media(max-width:768px){.banner-area{height:280px}}

/* MAIN LAYOUT */
.details-container{max-width:1400px;margin:0 auto;padding:0 24px 80px;position:relative}
.details-grid{display:grid;grid-template-columns:260px 1fr;gap:32px;margin-top:-120px;position:relative;z-index:2}
@media(max-width:900px){.details-grid{grid-template-columns:1fr;margin-top:-60px}}

/* SIDEBAR */
.details-sidebar{}
.poster-card{border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5);margin-bottom:16px}
.poster-card img{width:100%;aspect-ratio:2/3;object-fit:cover}
.action-btns{display:flex;flex-direction:column;gap:8px}
.btn-watch{padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent-bright));color:#fff;border-radius:10px;font-size:15px;font-weight:700;text-align:center;display:block;transition:all var(--transition);box-shadow:0 4px 20px var(--accent-glow)}
.btn-watch:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--accent-glow)}
.btn-outline{padding:11px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text-secondary);transition:all var(--transition)}
.btn-outline:hover,.btn-outline.active{border-color:var(--accent);color:var(--accent-bright);background:var(--accent-soft)}
.info-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-top:16px}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--text-muted);font-weight:500}
.info-value{color:var(--text-primary);font-weight:600;text-align:right;max-width:160px}

/* MAIN CONTENT */
.details-main{}
.anime-title{font-size:clamp(22px,4vw,42px);font-weight:900;line-height:1.1;letter-spacing:-1px;margin-bottom:6px}
.anime-title-jp{font-size:16px;color:var(--text-muted);font-weight:400;margin-bottom:16px}
.meta-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.meta-tag{padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700}
.meta-score{background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.3)}
.meta-rank{background:var(--accent-soft);color:var(--accent-bright);border:1px solid var(--border-accent)}
.meta-status-air{background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.3)}
.meta-status-end{background:rgba(100,100,120,0.2);color:var(--text-secondary);border:1px solid var(--border)}
.genre-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.genre-tag{padding:5px 14px;background:var(--accent-soft);border:1px solid var(--border-accent);border-radius:99px;font-size:12px;font-weight:600;color:var(--accent-bright);cursor:pointer;transition:all var(--transition)}
.genre-tag:hover{background:var(--accent);color:#fff}

/* TABS */
.tabs-wrap{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tab-btn{padding:12px 20px;font-size:14px;font-weight:600;color:var(--text-muted);border-bottom:2px solid transparent;white-space:nowrap;transition:all var(--transition);cursor:pointer}
.tab-btn:hover{color:var(--text-primary)}
.tab-btn.active{color:var(--accent-bright);border-bottom-color:var(--accent-bright)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* SYNOPSIS */
.synopsis-text{font-size:15px;color:var(--text-secondary);line-height:1.8;margin-bottom:16px}
.read-more{color:var(--accent-bright);font-size:13px;font-weight:600;cursor:pointer;background:none;border:none}

/* EPISODES */
.episodes-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.ep-filter{padding:8px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-family:'Outfit',sans-serif;font-size:13px;outline:none}
.episodes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
@media(max-width:480px){.episodes-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.ep-card{background:var(--bg-card);border:1px solid var(--border);border-radius:9px;padding:12px;cursor:pointer;transition:all var(--transition);display:flex;align-items:center;gap:10px}
.ep-card:hover{border-color:var(--accent);background:var(--accent-soft)}
.ep-num{width:36px;height:36px;border-radius:8px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--accent-bright);flex-shrink:0}
.ep-info{flex:1;min-width:0}
.ep-title{font-size:12px;font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep-date{font-size:11px;color:var(--text-muted)}

/* CHARACTERS */
.chars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.char-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all var(--transition)}
.char-card:hover{border-color:var(--border-accent);transform:translateY(-3px)}
.char-img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#0d0d1a}
.char-info{padding:10px}
.char-name{font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:3px}
.char-role{font-size:11px;color:var(--accent-bright)}

/* RELATIONS */
.relations-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.rel-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;gap:12px;cursor:pointer;transition:all var(--transition)}
.rel-card:hover{border-color:var(--border-accent)}
.rel-poster{width:56px;height:80px;border-radius:7px;object-fit:cover;flex-shrink:0;background:#0d0d1a}
.rel-info{flex:1;min-width:0}
.rel-relation{font-size:11px;color:var(--accent-bright);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
.rel-title{font-size:13px;font-weight:700;color:var(--text-primary);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rel-type{font-size:11px;color:var(--text-muted)}

/* RECOMMENDATIONS */
.recs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rec-card{border-radius:var(--radius);overflow:hidden;background:var(--bg-card);cursor:pointer;transition:all var(--transition)}
.rec-card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,0.4)}
.rec-img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#0d0d1a}
.rec-title{padding:8px;font-size:12px;font-weight:600;color:var(--text-primary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* TRAILER */
.trailer-wrap{position:relative;border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:16/9;background:#000}
.trailer-wrap iframe{width:100%;height:100%;border:none}

/* TOAST */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:14px 18px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;font-size:13.5px;font-weight:500;color:var(--text-primary);box-shadow:0 8px 30px rgba(0,0,0,0.4);animation:toastIn 0.3s ease forwards;pointer-events:all;max-width:320px;display:flex;align-items:center;gap:10px}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateX(20px)}}

/* SKELETON */
.skeleton{background:linear-gradient(90deg,var(--bg-card) 0%,rgba(255,255,255,0.06) 50%,var(--bg-card) 100%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>

<header id="header">
  <div class="header-inner">
    <button class="back-btn" onclick="history.back()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </button>
    <a href="index.html" class="logo">
      <div class="logo-mark">V</div>
      <span class="logo-text">AnimeVault</span>
    </a>
    <button class="icon-btn" onclick="window.location.href='index.html#search'" style="margin-left:auto">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </button>
  </div>
</header>

<!-- BANNER -->
<div class="banner-area">
  <div class="banner-bg" id="banner-bg"></div>
  <div class="banner-overlay"></div>
</div>

<!-- CONTENT -->
<div class="details-container">
  <div class="details-grid">
    <!-- Sidebar -->
    <div class="details-sidebar" id="details-sidebar">
      <div class="poster-card skeleton" id="poster-wrap" style="aspect-ratio:2/3"></div>
      <div class="action-btns" id="action-btns"></div>
      <div class="info-box" id="info-box"></div>
    </div>
    <!-- Main -->
    <div class="details-main" id="details-main">
      <div class="skeleton" style="height:48px;border-radius:8px;margin-bottom:12px"></div>
      <div class="skeleton" style="height:20px;border-radius:8px;margin-bottom:20px;width:60%"></div>
      <div class="skeleton" style="height:80px;border-radius:8px;margin-bottom:20px"></div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script>
'use strict';
const API = 'https://api.jikan.moe/v4';
const params = new URLSearchParams(location.search);
const animeId = params.get('id');
let animeData = null;
let isFav = false;
let isBookmarked = false;
let synopsisFull = false;

function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => { t.style.animation = 'toastOut 0.3s ease forwards'; setTimeout(() => t.remove(), 300); }, 3000);
}

async function fetchJ(url, retries = 3) {
  for (let i = 0; i < retries; i++) {
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(r.status);
      return await r.json();
    } catch (e) {
      if (i === retries - 1) throw e;
      await new Promise(r => setTimeout(r, 800 * (i + 1)));
    }
  }
}

function checkFavorites() {
  const favs = JSON.parse(localStorage.getItem('av_favorites') || '[]');
  isFav = favs.some(f => f.id == animeId);
  const bmks = JSON.parse(localStorage.getItem('av_bookmarks') || '[]');
  isBookmarked = bmks.some(b => b.id == animeId);
}

function toggleFavorite() {
  let favs = JSON.parse(localStorage.getItem('av_favorites') || '[]');
  if (isFav) { favs = favs.filter(f => f.id != animeId); toast('Removed from favorites'); }
  else { favs.push({ id: animeId, title: animeData.title, img: animeData.images?.webp?.large_image_url }); toast('Added to favorites ❤️', 'success'); }
  isFav = !isFav;
  localStorage.setItem('av_favorites', JSON.stringify(favs));
  renderActions();
}

function toggleBookmark() {
  let bmks = JSON.parse(localStorage.getItem('av_bookmarks') || '[]');
  if (isBookmarked) { bmks = bmks.filter(b => b.id != animeId); toast('Removed from bookmarks'); }
  else { bmks.push({ id: animeId, title: animeData.title, img: animeData.images?.webp?.large_image_url }); toast('Bookmarked 🔖', 'success'); }
  isBookmarked = !isBookmarked;
  localStorage.setItem('av_bookmarks', JSON.stringify(bmks));
  renderActions();
}

function renderActions() {
  document.getElementById('action-btns').innerHTML = `
    <a href="watch.html?id=${animeId}&ep=1" class="btn-watch">▶ Watch Now</a>
    <button class="btn-outline${isFav ? ' active' : ''}" onclick="toggleFavorite()">${isFav ? '❤️' : '🤍'} ${isFav ? 'Favorited' : 'Add Favorite'}</button>
    <button class="btn-outline${isBookmarked ? ' active' : ''}" onclick="toggleBookmark()">${isBookmarked ? '🔖' : '📌'} ${isBookmarked ? 'Bookmarked' : 'Bookmark'}</button>
    <button class="btn-outline" onclick="navigator.clipboard?.writeText(location.href);toast('Link copied!','success')">🔗 Share</button>`;
}

async function loadAnime() {
  if (!animeId) { document.getElementById('details-main').innerHTML = '<p style="color:var(--text-muted);padding:40px">No anime ID specified.</p>'; return; }
  checkFavorites();
  try {
    const [details, chars, recs, relations] = await Promise.allSettled([
      fetchJ(`${API}/anime/${animeId}/full`),
      fetchJ(`${API}/anime/${animeId}/characters`),
      fetchJ(`${API}/anime/${animeId}/recommendations`),
      fetchJ(`${API}/anime/${animeId}/relations`),
    ]);

    animeData = details.value?.data;
    if (!animeData) throw new Error('No data');

    // Set page title
    document.title = `${animeData.title_english || animeData.title} - AnimeVault`;

    // Banner
    const bannerImg = animeData.images?.webp?.large_image_url || animeData.images?.jpg?.large_image_url || '';
    document.getElementById('banner-bg').style.backgroundImage = `url('${bannerImg}')`;

    // Poster
    const pw = document.getElementById('poster-wrap');
    pw.className = 'poster-card';
    pw.innerHTML = `<img src="${bannerImg}" alt="${animeData.title}" loading="eager">`;

    // Info box
    const status = animeData.status || '';
    document.getElementById('info-box').innerHTML = `
      <div class="info-row"><span class="info-label">Score</span><span class="info-value">${animeData.score || 'N/A'} ⭐</span></div>
      <div class="info-row"><span class="info-label">Rank</span><span class="info-value">#${animeData.rank || 'N/A'}</span></div>
      <div class="info-row"><span class="info-label">Popularity</span><span class="info-value">#${animeData.popularity || 'N/A'}</span></div>
      <div class="info-row"><span class="info-label">Status</span><span class="info-value">${status}</span></div>
      <div class="info-row"><span class="info-label">Episodes</span><span class="info-value">${animeData.episodes || '?'}</span></div>
      <div class="info-row"><span class="info-label">Duration</span><span class="info-value">${animeData.duration || 'N/A'}</span></div>
      <div class="info-row"><span class="info-label">Type</span><span class="info-value">${animeData.type || 'N/A'}</span></div>
      <div class="info-row"><span class="info-label">Rating</span><span class="info-value">${animeData.rating || 'N/A'}</span></div>
      <div class="info-row"><span class="info-label">Season</span><span class="info-value">${animeData.season ? animeData.season + ' ' + animeData.year : 'N/A'}</span></div>
      <div class="info-row"><span class="info-label">Studios</span><span class="info-value">${(animeData.studios || []).map(s => s.name).join(', ') || 'N/A'}</span></div>`;

    // Actions
    renderActions();

    // Main content
    const genres = (animeData.genres || []).map(g => `<span class="genre-tag" onclick="window.location.href='search.html?genre=${g.mal_id}'">${g.name}</span>`).join('');
    const isAiring = status === 'Currently Airing';
    const synopsis = (animeData.synopsis || 'No synopsis available.').replace(/\[Written by MAL Rewrite\]/g, '').trim();
    const shortSyn = synopsis.length > 400 ? synopsis.slice(0, 400) + '...' : synopsis;

    document.getElementById('details-main').innerHTML = `
      <h1 class="anime-title">${animeData.title_english || animeData.title}</h1>
      ${animeData.title_japanese ? `<p class="anime-title-jp">${animeData.title_japanese}</p>` : ''}
      <div class="meta-row">
        ${animeData.score ? `<span class="meta-tag meta-score">⭐ ${animeData.score}/10</span>` : ''}
        ${animeData.rank ? `<span class="meta-tag meta-rank">#${animeData.rank} Ranked</span>` : ''}
        <span class="meta-tag ${isAiring ? 'meta-status-air' : 'meta-status-end'}">${isAiring ? '● ' : ''}${status}</span>
        ${animeData.type ? `<span class="meta-tag" style="background:var(--bg-card);border:1px solid var(--border)">${animeData.type}</span>` : ''}
      </div>
      <div class="genre-tags">${genres}</div>

      <!-- TABS -->
      <div class="tabs-wrap">
        <div class="tab-btn active" data-tab="overview">Overview</div>
        <div class="tab-btn" data-tab="episodes">Episodes</div>
        <div class="tab-btn" data-tab="characters">Characters</div>
        <div class="tab-btn" data-tab="relations">Relations</div>
        <div class="tab-btn" data-tab="recommendations">Recommended</div>
        ${animeData.trailer?.youtube_id ? `<div class="tab-btn" data-tab="trailer">Trailer</div>` : ''}
      </div>

      <!-- Overview -->
      <div class="tab-panel active" id="tab-overview">
        <p class="synopsis-text" id="synopsis-text">${shortSyn}</p>
        ${synopsis.length > 400 ? `<button class="read-more" onclick="toggleSynopsis()">Read more</button>` : ''}
      </div>

      <!-- Episodes -->
      <div class="tab-panel" id="tab-episodes">
        <div class="episodes-header">
          <span style="font-size:14px;color:var(--text-secondary)">${animeData.episodes || '?'} Episodes</span>
          <select class="ep-filter" id="ep-range" onchange="renderEpisodes()">
            <option value="1-100">Episodes 1-100</option>
            <option value="101-200">Episodes 101-200</option>
            <option value="201-300">Episodes 201-300</option>
          </select>
        </div>
        <div class="episodes-grid" id="episodes-grid">
          <div style="color:var(--text-muted);font-size:14px;padding:20px">Loading episodes...</div>
        </div>
      </div>

      <!-- Characters -->
      <div class="tab-panel" id="tab-characters">
        <div class="chars-grid" id="chars-grid">
          <div style="color:var(--text-muted);font-size:14px;padding:20px">Loading characters...</div>
        </div>
      </div>

      <!-- Relations -->
      <div class="tab-panel" id="tab-relations">
        <div class="relations-list" id="relations-list">
          <div style="color:var(--text-muted);font-size:14px;padding:20px">Loading relations...</div>
        </div>
      </div>

      <!-- Recommendations -->
      <div class="tab-panel" id="tab-recommendations">
        <div class="recs-grid" id="recs-grid">
          <div style="color:var(--text-muted);font-size:14px;padding:20px">Loading recommendations...</div>
        </div>
      </div>

      ${animeData.trailer?.youtube_id ? `
      <div class="tab-panel" id="tab-trailer">
        <div class="trailer-wrap">
          <iframe src="https://www.youtube.com/embed/${animeData.trailer.youtube_id}" allowfullscreen loading="lazy"></iframe>
        </div>
      </div>` : ''}
    `;

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`tab-${btn.dataset.tab}`)?.classList.add('active');
        if (btn.dataset.tab === 'episodes') renderEpisodes();
        if (btn.dataset.tab === 'characters') renderChars(chars.value?.data || []);
        if (btn.dataset.tab === 'relations') renderRelations(relations.value?.data || []);
        if (btn.dataset.tab === 'recommendations') renderRecs(recs.value?.data || []);
      };
    });

    window._synopsis = synopsis;
    window._synShort = shortSyn;
  } catch (e) {
    console.error(e);
    document.getElementById('details-main').innerHTML = `<p style="color:var(--text-muted);padding:40px">Failed to load anime details. <button onclick="loadAnime()" style="color:var(--accent-bright);cursor:pointer;background:none;border:none;font-family:inherit">Retry</button></p>`;
  }
}

function toggleSynopsis() {
  const el = document.getElementById('synopsis-text');
  const btn = document.querySelector('.read-more');
  synopsisFull = !synopsisFull;
  el.textContent = synopsisFull ? window._synopsis : window._synShort;
  if (btn) btn.textContent = synopsisFull ? 'Show less' : 'Read more';
}

function renderEpisodes() {
  const grid = document.getElementById('episodes-grid');
  if (!grid) return;
  const total = animeData?.episodes || 12;
  const range = document.getElementById('ep-range')?.value || '1-100';
  const [start, end] = range.split('-').map(Number);
  const eps = Array.from({ length: Math.min(end, total) - start + 1 }, (_, i) => start + i);
  grid.innerHTML = eps.map(ep => `
    <div class="ep-card" onclick="window.location.href='watch.html?id=${animeId}&ep=${ep}'">
      <div class="ep-num">${ep}</div>
      <div class="ep-info">
        <div class="ep-title">Episode ${ep}</div>
        <div class="ep-date">Click to watch</div>
      </div>
    </div>`).join('');
}

function renderChars(data) {
  const grid = document.getElementById('chars-grid');
  if (!grid) return;
  if (!data.length) { grid.innerHTML = '<p style="color:var(--text-muted);font-size:14px">No character data available.</p>'; return; }
  grid.innerHTML = data.slice(0, 24).map(c => {
    const ch = c.character || {};
    const img = ch.images?.webp?.image_url || ch.images?.jpg?.image_url || '';
    return `<div class="char-card">
      <img class="char-img" src="${img}" alt="${ch.name || ''}" loading="lazy">
      <div class="char-info">
        <div class="char-name">${ch.name || 'Unknown'}</div>
        <div class="char-role">${c.role || ''}</div>
      </div>
    </div>`;
  }).join('');
}

function renderRelations(data) {
  const list = document.getElementById('relations-list');
  if (!list) return;
  const all = data.flatMap(r => (r.entry || []).map(e => ({ ...e, relation: r.relation })));
  if (!all.length) { list.innerHTML = '<p style="color:var(--text-muted);font-size:14px">No relation data available.</p>'; return; }
  list.innerHTML = all.filter(e => e.type === 'anime').slice(0, 12).map(e => `
    <div class="rel-card" onclick="window.location.href='anime.html?id=${e.mal_id}'">
      <div class="rel-info">
        <div class="rel-relation">${e.relation}</div>
        <div class="rel-title">${e.name}</div>
        <div class="rel-type">Anime</div>
      </div>
    </div>`).join('');
}

function renderRecs(data) {
  const grid = document.getElementById('recs-grid');
  if (!grid) return;
  if (!data.length) { grid.innerHTML = '<p style="color:var(--text-muted);font-size:14px">No recommendations available.</p>'; return; }
  grid.innerHTML = data.slice(0, 12).map(r => {
    const a = r.entry || {};
    const img = a.images?.webp?.large_image_url || a.images?.jpg?.large_image_url || '';
    return `<div class="rec-card" onclick="window.location.href='anime.html?id=${a.mal_id}'">
      <img class="rec-img" src="${img}" alt="${a.title || ''}" loading="lazy">
      <div class="rec-title">${a.title || 'Unknown'}</div>
    </div>`;
  }).join('');
}

loadAnime();
</script>
</body>
</html>
