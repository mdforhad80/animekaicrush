<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeStream - Details</title>
  <style>
    :root {
      --bg-primary: #0a0a0f; --bg-secondary: #111118; --bg-tertiary: #1a1a24;
      --bg-card: #16161f; --purple-400: #a78bfa; --purple-500: #8b5cf6;
      --purple-600: #7c3aed; --purple-glow: rgba(139,92,246,0.3);
      --text-primary: #f1f1f6; --text-secondary: #b0b0c0; --text-muted: #777790;
      --border-subtle: rgba(255,255,255,0.06); --border-medium: rgba(255,255,255,0.1);
      --radius-sm: 8px; --radius-md: 12px; --radius-xl: 20px;
      --transition-smooth: 0.3s cubic-bezier(0.4,0,0.2,1);
      --safe-top: env(safe-area-inset-top, 0px);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body { overflow-x:hidden; max-width:100%; }
    body {
      font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg-primary);
      color:var(--text-primary); line-height:1.6; padding-top: calc(60px + var(--safe-top));
    }
    /* Minimal top bar */
    .top-bar {
      position:fixed; top:0; left:0; right:0; z-index:1000; height:60px;
      background:rgba(10,10,15,0.85); backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border-subtle); display:flex; align-items:center;
      padding:0 clamp(16px,4vw,32px); gap:20px;
    }
    .top-bar a {
      color:var(--text-secondary); text-decoration:none; font-weight:600;
      transition:color var(--transition-smooth);
    }
    .top-bar a:hover { color:#fff; }
    .logo {
      font-weight:800; background:linear-gradient(135deg,#c4b5fd,#8b5cf6,#6d28d9);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .container { max-width:1200px; margin:0 auto; padding:20px clamp(16px,4vw,32px) 40px; }
    .banner {
      width:100%; height:clamp(200px,35vw,400px); object-fit:cover;
      border-radius:var(--radius-md); margin-bottom:24px; background:var(--bg-tertiary);
    }
    .details-grid { display:grid; grid-template-columns:minmax(200px,250px) 1fr; gap:clamp(20px,4vw,40px); }
    .poster { width:100%; border-radius:var(--radius-md); }
    h1 { font-size:clamp(1.5rem,3vw,2.2rem); margin-bottom:12px; }
    .meta { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:16px; color:var(--text-secondary); font-size:0.9rem; }
    .badge { background:rgba(139,92,246,0.2); padding:4px 12px; border-radius:20px; font-size:0.8rem; }
    .synopsis { line-height:1.7; color:#ccc; margin-bottom:24px; }
    .btn {
      display:inline-flex; align-items:center; gap:8px; padding:12px 28px;
      border-radius:50px; font-weight:600; background:linear-gradient(135deg,#8b5cf6,#6d28d9);
      color:#fff; text-decoration:none; transition:all var(--transition-smooth);
    }
    .btn:hover { box-shadow:0 0 30px var(--purple-glow); transform:translateY(-2px); }
    .section { margin-top:40px; }
    .section h2 { margin-bottom:16px; font-size:1.3rem; font-weight:700; }
    .card-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:14px; }
    .card {
      background:var(--bg-card); border-radius:var(--radius-md); overflow:hidden;
      cursor:pointer; transition:transform var(--transition-smooth), box-shadow var(--transition-smooth);
      border:1px solid transparent;
    }
    .card:hover { transform:translateY(-4px); border-color:var(--purple-500); box-shadow:0 0 20px var(--purple-glow); }
    .card img { width:100%; aspect-ratio:3/4; object-fit:cover; background:var(--bg-tertiary); }
    .card p { padding:8px 10px; font-size:0.8rem; text-align:center; color:var(--text-secondary); }
    @media (max-width:768px) {
      .details-grid { grid-template-columns:1fr; }
      .poster { max-width:200px; margin:0 auto; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="index.html" class="logo">← Back to AnimeStream</a>
    <span style="flex:1;"></span>
  </div>
  <div class="container" id="app">Loading...</div>
  <script>
    const API='https://api.jikan.moe/v4';
    const params=new URLSearchParams(location.search);
    const id=params.get('id');
    if(!id) location.href='index.html';
    async function fetchJSON(url){const r=await fetch(url);if(!r.ok)throw Error;return r.json();}
    (async()=>{
      try{
        const [animeRes,charsRes,recsRes]=await Promise.allSettled([
          fetchJSON(`${API}/anime/${id}/full`),
          fetchJSON(`${API}/anime/${id}/characters`),
          fetchJSON(`${API}/anime/${id}/recommendations`)
        ]);
        const anime=animeRes.value?.data;
        if(!anime) return document.getElementById('app').innerHTML='<p>Anime not found.</p>';
        const characters=charsRes.value?.data||[];
        const recs=recsRes.value?.data||[];
        document.getElementById('app').innerHTML=`
          <img class="banner" src="${anime.images?.jpg?.large_image_url||anime.images?.jpg?.image_url||''}" alt="${anime.title}">
          <div class="details-grid">
            <img class="poster" src="${anime.images?.jpg?.image_url||''}" alt="${anime.title}">
            <div class="info">
              <h1>${anime.title}</h1>
              <div class="meta">
                <span>⭐ ${anime.score||'N/A'}</span>
                <span>${anime.type||'TV'}</span>
                <span>${anime.episodes||'?'} eps</span>
                <span class="badge">${anime.status||''}</span>
              </div>
              <div class="synopsis">${anime.synopsis||'No synopsis available.'}</div>
              <a href="watch.html?id=${anime.mal_id}&ep=1" class="btn">▶ Watch Now</a>
            </div>
          </div>
          ${characters.length?`<div class="section"><h2>Characters</h2><div class="card-grid">${characters.slice(0,8).map(c=>`
            <div class="card"><img src="${c.character.images?.jpg?.image_url||''}" alt="${c.character.name}"><p>${c.character.name}</p></div>`).join('')}</div></div>`:''}
          ${recs.length?`<div class="section"><h2>Recommendations</h2><div class="card-grid">${recs.slice(0,8).map(r=>`
            <div class="card" onclick="location.href='anime.html?id=${r.entry.mal_id}'"><img src="${r.entry.images?.jpg?.image_url||''}" alt="${r.entry.title}"><p>${r.entry.title}</p></div>`).join('')}</div></div>`:''}
        `;
      }catch(e){document.getElementById('app').innerHTML='<p>Failed to load anime details.</p>';}
    })();
  </script>
</body>
</html>
