<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genres — NexStream</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow-x: hidden; max-width: 100%; min-height: 100dvh; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f; color: #e2e8f0;
    }
    a { text-decoration: none; color: inherit; }
    button { border: none; background: none; cursor: pointer; font-family: inherit; color: inherit; }
    img { max-width: 100%; display: block; }
    
    :root {
      --primary: #8b5cf6; --primary-light: #a855f7;
      --bg-deep: #0a0a0f; --bg-surface: #13131f; --bg-elevated: #1a1a2e;
      --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #64748b;
      --border: rgba(255,255,255,0.08);
      --radius-md: 12px; --radius-lg: 16px;
      --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    
    .header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(10,10,15,0.95); backdrop-filter: blur(20px);
      padding: 0 4vw; height: 70px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--primary-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-secondary); transition: var(--transition); }
    .icon-btn:hover { background: var(--primary); color: white; }
    
    .page-header { padding: 100px 4vw 2rem; max-width: 1400px; margin: 0 auto; }
    .page-title { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 800; margin-bottom: 0.5rem; }
    .page-desc { color: var(--text-muted); }
    
    .genres-grid {
      padding: 0 4vw 4rem;
      max-width: 1400px; margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .genre-card {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 1.5rem;
      transition: var(--transition);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .genre-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      opacity: 0;
      transition: var(--transition);
    }
    .genre-card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .genre-card:hover::before { opacity: 1; }
    .genre-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .genre-count { font-size: 0.85rem; color: var(--text-muted); }
    .genre-desc { font-size: 0.9rem; color: var(--text-secondary); margin-top: 0.75rem; line-height: 1.5; }
    
    @media (max-width: 768px) {
      .header { padding: 0 1rem; }
      .page-header { padding: 90px 1rem 1.5rem; }
      .genres-grid { padding: 0 1rem 3rem; grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div style="display:flex;align-items:center;gap:1rem;">
      <button class="icon-btn" onclick="history.back()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
      </button>
      <a href="index.html" class="logo">NexStream</a>
    </div>
  </header>

  <div class="page-header">
    <h1 class="page-title">Browse by Genre</h1>
    <p class="page-desc">Discover anime across every genre</p>
  </div>

  <div class="genres-grid" id="genresGrid"></div>

  <script>
    const CONFIG = { API_BASE: 'https://api.jikan.moe/v4' };

    async function loadGenres() {
      try {
        const res = await fetch(`${CONFIG.API_BASE}/genres/anime`);
        const data = await res.json();
        const genres = data.data || [];
        
        $('#genresGrid').innerHTML = genres.map(g => `
          <a href="search.html?genre=${g.mal_id}" class="genre-card">
            <div class="genre-name">${g.name}</div>
            <div class="genre-count">${g.count?.toLocaleString() || 0} titles</div>
            <div class="genre-desc">Explore the best ${g.name.toLowerCase()} anime series and movies.</div>
          </a>
        `).join('');
      } catch (err) {
        $('#genresGrid').innerHTML = '<p style="color:var(--text-muted);padding:2rem;text-align:center;">Failed to load genres.</p>';
      }
    }

    function $(sel) { return document.querySelector(sel); }

    document.addEventListener('DOMContentLoaded', loadGenres);
  </script>
</body>
</html>
