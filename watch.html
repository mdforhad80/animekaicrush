<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch - AnimeVault</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg-primary:#080810;--bg-secondary:#0d0d1a;--bg-card:#111122;--bg-glass:rgba(255,255,255,0.04);--accent:#7c3aed;--accent-bright:#a855f7;--accent-glow:rgba(124,58,237,0.4);--accent-soft:rgba(168,85,247,0.15);--text-primary:#f0f0ff;--text-secondary:#8888aa;--text-muted:#55556a;--border:rgba(255,255,255,0.07);--border-accent:rgba(124,58,237,0.3);--header-h:56px;--radius:10px;--radius-lg:16px;--transition:0.25s cubic-bezier(0.4,0,0.2,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100%;background:var(--bg-primary);color:var(--text-primary);font-family:'Outfit',sans-serif}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* HEADER */
#header{position:sticky;top:0;left:0;right:0;height:var(--header-h);z-index:1000;background:rgba(8,8,16,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;height:100%;padding:0 20px;gap:12px;max-width:1800px;margin:0 auto}
.logo{display:flex;align-items:center;gap:8px}
.logo-mark{width:30px;height:30px;background:linear-gradient(135deg,var(--accent),var(--accent-bright));border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px}
.logo-text{font-size:19px;font-weight:800;background:linear-gradient(135deg,#fff 40%,var(--accent-bright));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);margin-left:16px;min-width:0;overflow:hidden}
.breadcrumb a{color:var(--text-secondary);transition:color var(--transition);white-space:nowrap}
.breadcrumb a:hover{color:var(--accent-bright)}
.breadcrumb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.header-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:16px;transition:all var(--transition)}
.icon-btn:hover{background:var(--bg-glass);color:var(--text-primary)}

/* LAYOUT */
.watch-layout{display:grid;grid-template-columns:1fr 340px;gap:0;min-height:calc(100vh - var(--header-h))}
@media(max-width:1100px){.watch-layout{grid-template-columns:1fr}}
.watch-main{min-width:0}
.watch-sidebar{border-left:1px solid var(--border);overflow-y:auto;max-height:calc(100vh - var(--header-h));position:sticky;top:var(--header-h)}
@media(max-width:1100px){.watch-sidebar{display:none}}

/* PLAYER */
.player-wrap{position:relative;background:#000;width:100%}
.player-wrap.theater{position:fixed;inset:var(--header-h) 0 0 0;z-index:500;background:#000}
.player-container{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.player-container iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.player-overlay{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 70%,rgba(0,0,0,0.3) 100%)}

/* PLAYER CONTROLS */
.player-controls{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--bg-secondary);border-bottom:1px solid var(--border);flex-wrap:wrap}
.control-group{display:flex;align-items:center;gap:4px}
.ctrl-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-secondary);transition:all var(--transition);border:1px solid transparent}
.ctrl-btn:hover{background:var(--bg-glass);border-color:var(--border);color:var(--text-primary)}
.ctrl-btn.active{background:var(--accent-soft);border-color:var(--border-accent);color:var(--accent-bright)}
.ctrl-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ctrl-btn.primary:hover{background:var(--accent-bright)}
.ctrl-sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.sub-dub{display:flex;background:rgba(255,255,255,0.05);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
.sd-btn{padding:7px 16px;font-size:13px;font-weight:600;color:var(--text-muted);transition:all var(--transition)}
.sd-btn.active{background:var(--accent);color:#fff}

/* SERVER SELECTOR */
.server-section{padding:14px 16px;background:var(--bg-secondary);border-bottom:1px solid var(--border)}
.server-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:10px}
.servers{display:flex;flex-wrap:wrap;gap:8px}
.server-btn{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-secondary);border:1px solid var(--border);transition:all var(--transition)}
.server-btn:hover{border-color:var(--accent);color:var(--accent-bright)}
.server-btn.active{background:var(--accent-soft);border-color:var(--accent-bright);color:var(--accent-bright)}

/* ANIME INFO */
.watch-info{padding:20px 20px 0}
.watch-title{font-size:clamp(18px,3vw,26px);font-weight:800;margin-bottom:6px;letter-spacing:-0.5px}
.watch-meta{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text-muted);flex-wrap:wrap;margin-bottom:16px}
.watch-meta span{display:flex;align-items:center;gap:4px}
.watch-actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px;margin-bottom:16px}
.wa-btn{display:flex;align-items:center;gap:6px;padding:9px 18px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-secondary);border:1.5px solid var(--border);transition:all var(--transition)}
.wa-btn:hover,.wa-btn.active{border-color:var(--accent);color:var(--accent-bright);background:var(--accent-soft)}

/* EPISODE LIST */
.eps-section{padding:16px 20px}
.eps-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.eps-label{font-size:14px;font-weight:700}
.eps-search{padding:7px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-family:'Outfit',sans-serif;font-size:13px;outline:none;width:100%;margin-bottom:10px}
.eps-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px;max-height:300px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--accent) transparent}
.ep-pill{padding:8px 4px;border-radius:7px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;border:1px solid var(--border);transition:all var(--transition);color:var(--text-muted)}
.ep-pill:hover{border-color:var(--accent);color:var(--accent-bright)}
.ep-pill.current{background:var(--accent);border-color:var(--accent);color:#fff}
.ep-pill.watched{border-color:rgba(16,185,129,0.3);color:rgba(16,185,129,0.7)}

/* COMMENTS */
.comments-section{padding:20px;border-top:1px solid var(--border)}
.comments-title{font-size:16px;font-weight:700;margin-bottom:16px}
.comment-input-wrap{display:flex;gap:10px;margin-bottom:20px}
.comment-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.comment-input{flex:1;padding:10px 14px;background:var(--bg-card);border:1.5px solid var(--border);border-radius:10px;color:var(--text-primary);font-family:'Outfit',sans-serif;font-size:14px;outline:none;resize:none;min-height:44px;transition:border-color var(--transition)}
.comment-input:focus{border-color:var(--accent)}
.comment-submit{padding:10px 18px;background:var(--accent);color:#fff;border-radius:9px;font-size:13px;font-weight:700;transition:all var(--transition);align-self:flex-end;flex-shrink:0}
.comment-submit:hover{background:var(--accent-bright)}
.comment-list{display:flex;flex-direction:column;gap:16px}
.comment-item{display:flex;gap:12px}
.comment-avatar-sm{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;color:var(--accent-bright)}
.comment-body{flex:1}
.comment-header{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.comment-user{font-size:13px;font-weight:700}
.comment-time{font-size:11px;color:var(--text-muted)}
.comment-text{font-size:13.5px;color:var(--text-secondary);line-height:1.6}
.comment-actions{display:flex;gap:12px;margin-top:6px}
.comment-action{font-size:12px;color:var(--text-muted);cursor:pointer;transition:color var(--transition)}
.comment-action:hover{color:var(--accent-bright)}

/* SIDEBAR CONTENT */
.sidebar-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);padding:16px 16px 8px}
.related-card{display:flex;gap:10px;padding:10px 16px;cursor:pointer;transition:background var(--transition)}
.related-card:hover{background:rgba(255,255,255,0.03)}
.related-img{width:56px;height:80px;border-radius:7px;object-fit:cover;background:#0d0d1a;flex-shrink:0}
.related-info{flex:1;min-width:0}
.related-title{font-size:13px;font-weight:600;color:var(--text-primary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.related-meta{font-size:11px;color:var(--text-muted)}

/* TOAST */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;font-size:13px;font-weight:500;color:var(--text-primary);box-shadow:0 8px 30px rgba(0,0,0,0.4);animation:toastIn 0.3s ease;pointer-events:all;display:flex;align-items:center;gap:8px}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* KEYBOARD HINTS */
.kb-hints{display:flex;gap:12px;flex-wrap:wrap;padding:8px 20px;background:rgba(0,0,0,0.3);border-bottom:1px solid var(--border);font-size:11px;color:var(--text-muted)}
.kb-hint{display:flex;align-items:center;gap:5px}
.kb-key{padding:2px 6px;background:var(--bg-card);border:1px solid var(--border);border-radius:4px;font-size:10px;font-weight:700}

@media(max-width:768px){
  .breadcrumb{display:none}
  .player-controls{gap:5px;padding:8px 12px}
  .ctrl-btn{padding:6px 10px;font-size:12px}
  .watch-layout{grid-template-columns:1fr}
  .kb-hints{display:none}
}
</style>
</head>
<body>

<header id="header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <div class="logo-mark">V</div>
      <span class="logo-text">AnimeVault</span>
    </a>
    <div class="breadcrumb" id="breadcrumb">
      <a href="index.html">Home</a>
      <span>›</span>
      <a href="#" id="bc-anime">Anime</a>
      <span>›</span>
      <span id="bc-ep">Episode</span>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="window.location.href='index.html'" title="Home">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="watch-layout">
  <!-- MAIN -->
  <div class="watch-main">
    <!-- Player -->
    <div class="player-wrap" id="player-wrap">
      <div class="player-container" id="player-container">
        <iframe id="player-iframe" allowfullscreen allow="autoplay; fullscreen" loading="lazy"></iframe>
        <div class="player-overlay"></div>
      </div>
    </div>

    <!-- Controls -->
    <div class="player-controls">
      <div class="control-group">
        <div class="sub-dub">
          <button class="sd-btn active" id="btn-sub" onclick="switchLang('sub')">SUB</button>
          <button class="sd-btn" id="btn-dub" onclick="switchLang('dub')">DUB</button>
        </div>
      </div>
      <div class="ctrl-sep"></div>
      <div class="control-group">
        <button class="ctrl-btn" id="btn-prev-ep" onclick="prevEp()">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          Prev
        </button>
        <button class="ctrl-btn" id="btn-next-ep" onclick="nextEp()">
          Next
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
      <div class="ctrl-sep"></div>
      <button class="ctrl-btn" id="theater-btn" onclick="toggleTheater()">⛶ Theater</button>
      <div class="ctrl-sep"></div>
      <button class="ctrl-btn" id="fav-btn" onclick="toggleFav()">🤍 Favorite</button>
      <button class="ctrl-btn" id="bm-btn" onclick="toggleBm()">📌 Bookmark</button>
    </div>

    <!-- Servers -->
    <div class="server-section">
      <div class="server-label">Select Server</div>
      <div class="servers">
        <button class="server-btn active" onclick="setServer('megaplay')">MegaPlay</button>
        <button class="server-btn" onclick="setServer('backup')">Backup 1</button>
        <button class="server-btn" onclick="setServer('backup2')">Backup 2</button>
      </div>
    </div>

    <!-- Keyboard shortcuts -->
    <div class="kb-hints">
      <div class="kb-hint"><span class="kb-key">N</span> Next episode</div>
      <div class="kb-hint"><span class="kb-key">P</span> Previous episode</div>
      <div class="kb-hint"><span class="kb-key">T</span> Theater mode</div>
      <div class="kb-hint"><span class="kb-key">F</span> Fullscreen</div>
      <div class="kb-hint"><span class="kb-key">ESC</span> Exit theater</div>
    </div>

    <!-- Info -->
    <div class="watch-info">
      <div class="watch-title" id="watch-title">Loading...</div>
      <div class="watch-meta">
        <span>📺 <span id="anime-type">TV</span></span>
        <span>⭐ <span id="anime-score">–</span></span>
        <span>📅 <span id="anime-year">–</span></span>
        <span style="color:var(--accent-bright)">● Episode <span id="current-ep-label">1</span></span>
      </div>
    </div>

    <!-- Actions -->
    <div class="watch-actions">
      <button class="wa-btn" id="wa-fav" onclick="toggleFav()">🤍 Favorite</button>
      <button class="wa-btn" id="wa-bm" onclick="toggleBm()">📌 Bookmark</button>
      <button class="wa-btn" onclick="shareLink()">🔗 Share</button>
      <a class="wa-btn" id="wa-details" href="#">ℹ Details</a>
    </div>

    <!-- Episodes -->
    <div class="eps-section">
      <div class="eps-header">
        <span class="eps-label">Episodes</span>
        <span id="total-eps-label" style="font-size:12px;color:var(--text-muted)"></span>
      </div>
      <input type="text" class="eps-search" id="eps-search" placeholder="Search episode number..." oninput="filterEps()">
      <div class="eps-list" id="eps-list"></div>
    </div>

    <!-- Comments -->
    <div class="comments-section">
      <div class="comments-title">💬 Comments</div>
      <div class="comment-input-wrap">
        <div class="comment-avatar" id="comment-avatar">G</div>
        <textarea class="comment-input" id="comment-input" placeholder="Share your thoughts on this episode..." rows="2"></textarea>
        <button class="comment-submit" onclick="submitComment()">Post</button>
      </div>
      <div class="comment-list" id="comment-list"></div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="watch-sidebar">
    <div class="sidebar-label">Up Next</div>
    <div id="related-list"></div>
  </div>
</div>

<div id="toast-container"></div>

<script>
'use strict';
const API = 'https://api.jikan.moe/v4';
const STREAM_BASE = 'https://megaplay.buzz/stream/mal';
const params = new URLSearchParams(location.search);
const animeId = params.get('id');
let currentEp = parseInt(params.get('ep') || '1');
let currentLang = 'sub';
let theaterMode = false;
let animeData = null;
let totalEps = 12;
let isFav = false, isBm = false;

function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

async function fetchJ(url, retries = 3) {
  for (let i = 0; i < retries; i++) {
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(r.status);
      return await r.json();
    } catch (e) {
      if (i === retries - 1) throw e;
      await new Promise(r => setTimeout(r, 800));
    }
  }
}

function buildStreamUrl() {
  return `${STREAM_BASE}/${animeId}/${currentEp}/${currentLang}`;
}

function loadPlayer() {
  const iframe = document.getElementById('player-iframe');
  iframe.src = buildStreamUrl();
  document.getElementById('current-ep-label').textContent = currentEp;
  // Update URL without reload
  history.replaceState({}, '', `watch.html?id=${animeId}&ep=${currentEp}`);
  // Save history
  saveHistory();
  // Update episode pills
  document.querySelectorAll('.ep-pill').forEach(p => {
    p.classList.toggle('current', +p.dataset.ep === currentEp);
  });
  // Scroll pill into view
  const current = document.querySelector('.ep-pill.current');
  if (current) current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function switchLang(lang) {
  currentLang = lang;
  document.getElementById('btn-sub').classList.toggle('active', lang === 'sub');
  document.getElementById('btn-dub').classList.toggle('active', lang === 'dub');
  loadPlayer();
}

function prevEp() { if (currentEp > 1) { currentEp--; loadPlayer(); } }
function nextEp() { if (currentEp < totalEps) { currentEp++; loadPlayer(); } }

function toggleTheater() {
  theaterMode = !theaterMode;
  const wrap = document.getElementById('player-wrap');
  const btn = document.getElementById('theater-btn');
  wrap.classList.toggle('theater', theaterMode);
  btn.classList.toggle('active', theaterMode);
  btn.textContent = theaterMode ? '⛶ Exit Theater' : '⛶ Theater';
  if (theaterMode) document.body.style.overflow = 'hidden';
  else document.body.style.overflow = '';
}

function setServer(s) {
  document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  // In real impl, would switch stream source
  toast(`Switched to ${event.target.textContent}`, 'info');
}

function checkFavBm() {
  const favs = JSON.parse(localStorage.getItem('av_favorites') || '[]');
  isFav = favs.some(f => f.id == animeId);
  const bmks = JSON.parse(localStorage.getItem('av_bookmarks') || '[]');
  isBm = bmks.some(b => b.id == animeId);
  updateFavBmUI();
}

function updateFavBmUI() {
  const fb = document.getElementById('fav-btn');
  const wb = document.getElementById('wa-fav');
  if (fb) { fb.textContent = isFav ? '❤️ Favorited' : '🤍 Favorite'; fb.classList.toggle('active', isFav); }
  if (wb) { wb.textContent = isFav ? '❤️ Favorited' : '🤍 Favorite'; wb.classList.toggle('active', isFav); }
  const bb = document.getElementById('bm-btn');
  const wbb = document.getElementById('wa-bm');
  if (bb) { bb.textContent = isBm ? '🔖 Bookmarked' : '📌 Bookmark'; bb.classList.toggle('active', isBm); }
  if (wbb) { wbb.textContent = isBm ? '🔖 Bookmarked' : '📌 Bookmark'; wbb.classList.toggle('active', isBm); }
}

function toggleFav() {
  let favs = JSON.parse(localStorage.getItem('av_favorites') || '[]');
  if (isFav) { favs = favs.filter(f => f.id != animeId); toast('Removed from favorites'); }
  else {
    const img = animeData?.images?.webp?.large_image_url || '';
    favs.push({ id: animeId, title: animeData?.title || '', img });
    toast('Added to favorites ❤️', 'success');
  }
  isFav = !isFav;
  localStorage.setItem('av_favorites', JSON.stringify(favs));
  updateFavBmUI();
}

function toggleBm() {
  let bmks = JSON.parse(localStorage.getItem('av_bookmarks') || '[]');
  if (isBm) { bmks = bmks.filter(b => b.id != animeId); toast('Removed from bookmarks'); }
  else {
    const img = animeData?.images?.webp?.large_image_url || '';
    bmks.push({ id: animeId, title: animeData?.title || '', img });
    toast('Bookmarked 🔖', 'success');
  }
  isBm = !isBm;
  localStorage.setItem('av_bookmarks', JSON.stringify(bmks));
  updateFavBmUI();
}

function shareLink() { navigator.clipboard?.writeText(location.href); toast('Link copied! 🔗', 'success'); }

function saveHistory() {
  if (!animeId || !animeData) return;
  let history = JSON.parse(localStorage.getItem('av_history') || '[]');
  history = history.filter(h => h.id != animeId);
  history.unshift({ id: animeId, title: animeData.title || '', img: animeData.images?.webp?.large_image_url || '', ep: currentEp, ts: Date.now() });
  history = history.slice(0, 50);
  localStorage.setItem('av_history', JSON.stringify(history));
}

function renderEpsList() {
  const list = document.getElementById('eps-list');
  const watched = JSON.parse(localStorage.getItem(`av_watched_${animeId}`) || '[]');
  list.innerHTML = Array.from({ length: totalEps }, (_, i) => i + 1).map(ep =>
    `<div class="ep-pill${ep === currentEp ? ' current' : ''}${watched.includes(ep) ? ' watched' : ''}" data-ep="${ep}" onclick="currentEp=${ep};loadPlayer()">${ep}</div>`
  ).join('');
  document.getElementById('total-eps-label').textContent = `${totalEps} episodes`;
}

function filterEps() {
  const q = document.getElementById('eps-search').value.trim();
  document.querySelectorAll('.ep-pill').forEach(p => {
    p.style.display = (!q || p.dataset.ep.includes(q)) ? '' : 'none';
  });
}

function loadComments() {
  const key = `av_comments_${animeId}_${currentEp}`;
  const comments = JSON.parse(localStorage.getItem(key) || '[]');
  const user = JSON.parse(localStorage.getItem('av_user') || 'null');
  const list = document.getElementById('comment-list');
  if (!comments.length) {
    list.innerHTML = '<p style="color:var(--text-muted);font-size:13px">No comments yet. Be the first!</p>';
    return;
  }
  list.innerHTML = comments.map(c => `
    <div class="comment-item">
      <div class="comment-avatar-sm">${(c.user || 'G')[0]}</div>
      <div class="comment-body">
        <div class="comment-header">
          <span class="comment-user">${c.user || 'Guest'}</span>
          <span class="comment-time">${new Date(c.ts).toLocaleDateString()}</span>
        </div>
        <div class="comment-text">${c.text}</div>
        <div class="comment-actions">
          <span class="comment-action" onclick="likeComment(this)">👍 ${c.likes || 0}</span>
          <span class="comment-action">💬 Reply</span>
        </div>
      </div>
    </div>`).join('');

  // Set avatar
  const av = document.getElementById('comment-avatar');
  if (user) { av.textContent = user.name[0]; }
}

function submitComment() {
  const input = document.getElementById('comment-input');
  const text = input.value.trim();
  if (!text) return;
  const user = JSON.parse(localStorage.getItem('av_user') || 'null');
  const key = `av_comments_${animeId}_${currentEp}`;
  const comments = JSON.parse(localStorage.getItem(key) || '[]');
  comments.unshift({ text, user: user?.name || 'Guest', ts: Date.now(), likes: 0 });
  localStorage.setItem(key, JSON.stringify(comments));
  input.value = '';
  loadComments();
  toast('Comment posted! ✨', 'success');
}

function likeComment(btn) {
  const n = parseInt(btn.textContent.replace(/\D/g, '')) + 1;
  btn.textContent = `👍 ${n}`;
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'n' || e.key === 'N') nextEp();
  if (e.key === 'p' || e.key === 'P') prevEp();
  if (e.key === 't' || e.key === 'T') toggleTheater();
  if (e.key === 'Escape' && theaterMode) toggleTheater();
  if (e.key === 'f' || e.key === 'F') { const iframe = document.getElementById('player-iframe'); iframe?.requestFullscreen?.(); }
});

async function init() {
  if (!animeId) { document.getElementById('watch-title').textContent = 'No anime specified'; return; }
  checkFavBm();
  loadPlayer();

  try {
    const data = await fetchJ(`${API}/anime/${animeId}`);
    animeData = data.data;
    const a = animeData;
    document.title = `Ep ${currentEp} - ${a.title_english || a.title} | AnimeVault`;
    document.getElementById('watch-title').textContent = `${a.title_english || a.title} — Episode ${currentEp}`;
    document.getElementById('anime-type').textContent = a.type || '–';
    document.getElementById('anime-score').textContent = a.score || '–';
    document.getElementById('anime-year').textContent = a.year || '–';
    document.getElementById('bc-anime').textContent = a.title_english || a.title;
    document.getElementById('bc-anime').href = `anime.html?id=${animeId}`;
    document.getElementById('bc-ep').textContent = `Episode ${currentEp}`;
    document.getElementById('wa-details').href = `anime.html?id=${animeId}`;
    totalEps = a.episodes || 24;
    renderEpsList();
    loadComments();
    saveHistory();
    loadRelated();
  } catch (e) {
    document.getElementById('watch-title').textContent = 'Episode ' + currentEp;
    totalEps = 24;
    renderEpsList();
    loadComments();
  }
}

async function loadRelated() {
  try {
    const data = await fetchJ(`${API}/anime/${animeId}/recommendations`);
    const list = document.getElementById('related-list');
    const items = (data.data || []).slice(0, 10);
    if (!items.length) { list.innerHTML = '<p style="color:var(--text-muted);font-size:13px;padding:16px">No recommendations</p>'; return; }
    list.innerHTML = items.map(r => {
      const a = r.entry || {};
      const img = a.images?.webp?.large_image_url || a.images?.jpg?.large_image_url || '';
      return `<div class="related-card" onclick="window.location.href='watch.html?id=${a.mal_id}&ep=1'">
        <img class="related-img" src="${img}" alt="${a.title || ''}" loading="lazy">
        <div class="related-info">
          <div class="related-title">${a.title || 'Unknown'}</div>
          <div class="related-meta">Anime</div>
        </div>
      </div>`;
    }).join('');
  } catch (e) {}
}

init();
</script>
</body>
</html>
