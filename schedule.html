<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule — NexStream</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow-x: hidden; max-width: 100%; min-height: 100dvh; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f; color: #e2e8f0;
    }
    a { text-decoration: none; color: inherit; }
    button { border: none; background: none; cursor: pointer; font-family: inherit; color: inherit; }
    img { max-width: 100%; display: block; }
    
    :root {
      --primary: #8b5cf6; --primary-light: #a855f7;
      --bg-deep: #0a0a0f; --bg-surface: #13131f; --bg-elevated: #1a1a2e;
      --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #64748b;
      --border: rgba(255,255,255,0.08);
      --radius-md: 12px; --radius-lg: 16px;
      --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    
    .header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(10,10,15,0.95); backdrop-filter: blur(20px);
      padding: 0 4vw; height: 70px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--primary-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-secondary); transition: var(--transition); }
    .icon-btn:hover { background: var(--primary); color: white; }
    
    .page-header { padding: 100px 4vw 2rem; max-width: 1200px; margin: 0 auto; }
    .page-title { font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 800; }
    
    .day-tabs {
      display: flex; gap: 0.5rem;
      padding: 0 4vw 1.5rem;
      max-width: 1200px; margin: 0 auto;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .day-tabs::-webkit-scrollbar { display: none; }
    .day-tab {
      padding: 0.625rem 1.25rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-secondary);
      white-space: nowrap;
      transition: var(--transition);
      cursor: pointer;
    }
    .day-tab:hover, .day-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    .schedule-grid {
      padding: 0 4vw 4rem;
      max-width: 1200px; margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.25rem;
    }
    .schedule-card {
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: var(--transition);
    }
    .schedule-card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .schedule-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    .schedule-info { padding: 1rem; }
    .schedule-title { font-size: 0.95rem; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 0.5rem; }
    .schedule-time { font-size: 0.85rem; color: var(--primary-light); font-weight: 600; }
    .schedule-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }
    
    @media (max-width: 768px) {
      .header { padding: 0 1rem; }
      .page-header { padding: 90px 1rem 1.5rem; }
      .day-tabs { padding: 0 1rem 1rem; }
      .schedule-grid { padding: 0 1rem 3rem; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    }
  </style>
</head>
<body>

  <header class="header">
    <div style="display:flex;align-items:center;gap:1rem;">
      <button class="icon-btn" onclick="history.back()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
      </button>
      <a href="index.html" class="logo">NexStream</a>
    </div>
  </header>

  <div class="page-header">
    <h1 class="page-title">Anime Schedule</h1>
  </div>

  <div class="day-tabs" id="dayTabs"></div>
  <div class="schedule-grid" id="scheduleGrid"></div>

  <script>
    const CONFIG = { API_BASE: 'https://api.jikan.moe/v4' };
    const days = ['monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday', 'sunday', 'other', 'unknown'];
    let currentDay = 'monday';

    function renderDayTabs() {
      $('#dayTabs').innerHTML = days.map(d => `
        <button class="day-tab ${d === currentDay ? 'active' : ''}" onclick="loadSchedule('${d}')">
          ${d.charAt(0).toUpperCase() + d.slice(1)}
        </button>
      `).join('');
    }

    async function loadSchedule(day) {
      currentDay = day;
      renderDayTabs();
      $('#scheduleGrid').innerHTML = '<p style="color:var(--text-muted);padding:2rem;text-align:center;">Loading...</p>';
      
      try {
        const res = await fetch(`${CONFIG.API_BASE}/schedules?filter=${day}&limit=24`);
        const data = await res.json();
        const items = data.data || [];
        
        if (!items.length) {
          $('#scheduleGrid').innerHTML = '<p style="color:var(--text-muted);padding:2rem;text-align:center;">No anime scheduled for this day.</p>';
          return;
        }
        
        $('#scheduleGrid').innerHTML = items.map(anime => `
          <a href="anime.html?id=${anime.mal_id}" class="schedule-card">
            <img src="${anime.images?.webp?.large_image_url || anime.images?.jpg?.large_image_url || ''}" alt="${anime.title}" loading="lazy">
            <div class="schedule-info">
              <div class="schedule-title">${anime.title_english || anime.title}</div>
              <div class="schedule-time">${anime.broadcast?.time || 'TBA'} JST</div>
              <div class="schedule-meta">${anime.type || 'TV'} · EP ${anime.episodes || '?'}</div>
            </div>
          </a>
        `).join('');
      } catch (err) {
        $('#scheduleGrid').innerHTML = '<p style="color:var(--text-muted);padding:2rem;text-align:center;">Failed to load schedule.</p>';
      }
    }

    function $(sel) { return document.querySelector(sel); }

    document.addEventListener('DOMContentLoaded', () => {
      renderDayTabs();
      loadSchedule('monday');
    });
  </script>
</body>
</html>
