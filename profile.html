<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — NexStream</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow-x: hidden; max-width: 100%; min-height: 100dvh; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0f; color: #e2e8f0;
    }
    a { text-decoration: none; color: inherit; }
    button { border: none; background: none; cursor: pointer; font-family: inherit; color: inherit; }
    img { max-width: 100%; display: block; }
    
    :root {
      --primary: #8b5cf6; --primary-light: #a855f7; --primary-glow: rgba(139,92,246,0.4);
      --bg-deep: #0a0a0f; --bg-surface: #13131f; --bg-elevated: #1a1a2e;
      --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #64748b;
      --border: rgba(255,255,255,0.08);
      --radius-md: 12px; --radius-lg: 16px; --radius-xl: 24px;
      --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    
    .header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background: rgba(10,10,15,0.95); backdrop-filter: blur(20px);
      padding: 0 4vw; height: 70px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--primary-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-desktop { display: flex; gap: 1.5rem; }
    .nav-link { font-size: 0.9rem; font-weight: 500; color: var(--text-secondary); padding: 0.5rem 0.8rem; border-radius: 8px; transition: var(--transition); }
    .nav-link:hover, .nav-link.active { color: var(--text-primary); background: rgba(139,92,246,0.15); }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-secondary); transition: var(--transition); }
    .icon-btn:hover { background: var(--primary); color: white; }
    .mobile-menu-btn { display: none; }
    
    .profile-hero {
      padding: 120px 4vw 3rem;
      background: linear-gradient(135deg, rgba(139,92,246,0.1) 0%, transparent 50%);
    }
    .profile-card {
      max-width: 800px; margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      display: flex; gap: 2rem; align-items: flex-start;
    }
    .profile-avatar {
      width: 120px; height: 120px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 3px solid var(--primary);
      overflow: hidden;
      flex-shrink: 0;
    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .profile-info { flex: 1; }
    .profile-name { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.25rem; }
    .profile-username { color: var(--text-muted); font-size: 1rem; margin-bottom: 0.5rem; }
    .profile-email { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .profile-stats {
      display: flex; gap: 2rem; margin-bottom: 1.5rem;
    }
    .stat { text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
    .profile-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .btn {
      padding: 0.625rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex; align-items: center; gap: 0.5rem;
      transition: var(--transition); cursor: pointer;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-secondary { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
    .btn-danger { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    .btn-danger:hover { background: rgba(239,68,68,0.2); }
    
    .content-section { padding: 2rem 4vw; max-width: 1200px; margin: 0 auto; }
    .section-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 1.25rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
    .card {
      background: var(--bg-surface);
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
      transition: var(--transition);
    }
    .card:hover { transform: translateY(-4px); border-color: var(--primary); }
    .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; }
    .card-info { padding: 0.75rem; }
    .card-title { font-size: 0.85rem; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
    
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
    
    @media (max-width: 768px) {
      .profile-card { flex-direction: column; text-align: center; align-items: center; }
      .profile-stats { justify-content: center; }
      .profile-actions { justify-content: center; }
      .nav-desktop { display: none; }
      .mobile-menu-btn { display: flex; }
      .content-section { padding: 1.5rem 1rem; }
      .header { padding: 0 1rem; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div style="display:flex;align-items:center;gap:1rem;">
      <button class="icon-btn mobile-menu-btn" onclick="history.back()">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
      </button>
      <a href="index.html" class="logo">NexStream</a>
      <nav class="nav-desktop">
        <a href="index.html" class="nav-link">Home</a>
        <a href="favorites.html" class="nav-link">Favorites</a>
        <a href="bookmarks.html" class="nav-link">Bookmarks</a>
      </nav>
    </div>
    <div class="header-actions">
      <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>
  </header>

  <section class="profile-hero">
    <div class="profile-card" id="profileCard">
      <div class="profile-avatar skeleton" style="border:none;"></div>
      <div class="profile-info">
        <div class="skeleton" style="height:32px;width:200px;margin-bottom:0.5rem;"></div>
        <div class="skeleton" style="height:16px;width:150px;margin-bottom:1rem;"></div>
        <div class="skeleton" style="height:40px;width:300px;"></div>
      </div>
    </div>
  </section>

  <section class="content-section">
    <h2 class="section-title">Continue Watching</h2>
    <div class="grid" id="continueGrid"></div>
  </section>

  <section class="content-section">
    <h2 class="section-title">Watch History</h2>
    <div class="grid" id="historyGrid"></div>
  </section>

  <script>
    const CONFIG = {
      BACKEND_URL: localStorage.getItem('backend_url') || 'https://nexstream-api.your-subdomain.workers.dev',
    };

    async function loadProfile() {
      const token = localStorage.getItem('nexstream_token');
      if (!token) { window.location.href = 'login.html'; return; }

      try {
        const res = await fetch(`${CONFIG.BACKEND_URL}/api/auth/me`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!data.success) throw new Error('Auth failed');

        const user = data.user;
        $('#profileCard').innerHTML = `
          <div class="profile-avatar">
            <img src="${user.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.username}`}" alt="${user.username}">
          </div>
          <div class="profile-info">
            <h1 class="profile-name">${user.name || user.username}</h1>
            <p class="profile-username">@${user.username}</p>
            <p class="profile-email">${user.email}</p>
            <div class="profile-stats">
              <div class="stat">
                <div class="stat-value" id="favCount">0</div>
                <div class="stat-label">Favorites</div>
              </div>
              <div class="stat">
                <div class="stat-value" id="bmCount">0</div>
                <div class="stat-label">Bookmarks</div>
              </div>
              <div class="stat">
                <div class="stat-value" id="histCount">0</div>
                <div class="stat-label">Watched</div>
              </div>
            </div>
            <div class="profile-actions">
              <a href="favorites.html" class="btn btn-primary">Favorites</a>
              <a href="bookmarks.html" class="btn btn-secondary">Bookmarks</a>
              <a href="history.html" class="btn btn-secondary">History</a>
            </div>
          </div>
        `;

        loadUserData(token);
      } catch (err) {
        console.error('Profile load failed:', err);
        window.location.href = 'login.html';
      }
    }

    async function loadUserData(token) {
      try {
        const [favRes, bmRes, histRes] = await Promise.all([
          fetch(`${CONFIG.BACKEND_URL}/api/user/favorites`, { headers: { 'Authorization': `Bearer ${token}` } }),
          fetch(`${CONFIG.BACKEND_URL}/api/user/bookmarks`, { headers: { 'Authorization': `Bearer ${token}` } }),
          fetch(`${CONFIG.BACKEND_URL}/api/user/history`, { headers: { 'Authorization': `Bearer ${token}` } })
        ]);

        const favorites = (await favRes.json()).favorites || [];
        const bookmarks = (await bmRes.json()).bookmarks || [];
        const history = (await histRes.json()).history || [];

        $('#favCount').textContent = favorites.length;
        $('#bmCount').textContent = bookmarks.length;
        $('#histCount').textContent = history.length;

        // Continue watching (bookmarks with progress)
        $('#continueGrid').innerHTML = bookmarks.length ? bookmarks.slice(0, 6).map(b => `
          <a href="watch.html?id=${b.mal_id}&ep=${b.episode}" class="card">
            <img src="${b.image}" alt="${b.title}" loading="lazy">
            <div class="card-info">
              <div class="card-title">${b.title}</div>
              <div class="card-meta">EP ${b.episode}</div>
            </div>
          </a>
        `).join('') : '<div class="empty-state">No bookmarks yet.</div>';

        // History
        $('#historyGrid').innerHTML = history.length ? history.slice(0, 6).map(h => `
          <a href="watch.html?id=${h.mal_id}&ep=${h.episode}" class="card">
            <img src="${h.image}" alt="${h.title}" loading="lazy">
            <div class="card-info">
              <div class="card-title">${h.title}</div>
              <div class="card-meta">EP ${h.episode}</div>
            </div>
          </a>
        `).join('') : '<div class="empty-state">No watch history yet.</div>';

      } catch (err) {
        console.error('User data load failed:', err);
      }
    }

    function logout() {
      localStorage.removeItem('nexstream_token');
      localStorage.removeItem('nexstream_user');
      window.location.href = 'index.html';
    }

    function $(sel) { return document.querySelector(sel); }

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
